<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- 背景圆角渐变 -->
    <linearGradient id="dpBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- 顶部微光高光 -->
    <linearGradient id="dpSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- 脉冲折线发光效果 -->
    <filter id="dpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#14B8A6" flood-opacity="0.45"/>
    </filter>

    <!-- 数据柱渐变 -->
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <!-- 外层圆角底座 -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="url(#dpBgGrad)"/>
  
  <!-- 顶部轻微玻璃高光弧度 -->
  <rect x="8" y="8" width="104" height="52" rx="26" fill="url(#dpSheen)"/>

  <!-- 背景内嵌的微细数据柱（代表结构化数据基础） -->
  <rect x="30" y="62" width="10" height="26" rx="4" fill="url(#barGrad1)"/>
  <rect x="47" y="48" width="10" height="40" rx="4" fill="url(#barGrad2)"/>
  <rect x="64" y="56" width="10" height="32" rx="4" fill="url(#barGrad1)"/>
  <rect x="81" y="38" width="10" height="50" rx="4" fill="url(#barGrad3)"/>

  <!-- 动态脉冲波与跃迁折线（代表 Pulse 与智能洞察） -->
  <path d="M 24 72 L 42 72 L 52 38 L 68 80 L 80 44 L 96 44" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="7.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#dpGlow)"/>

  <!-- 脉冲峰值智能光点（Glowing nodes） -->
  <circle cx="52" cy="38" r="5" fill="#5EEAD4"/>
  <circle cx="52" cy="38" r="2.5" fill="#FFFFFF"/>

  <circle cx="80" cy="44" r="5.5" fill="#2DD4BF"/>
  <circle cx="80" cy="44" r="3" fill="#FFFFFF"/>
</svg>
